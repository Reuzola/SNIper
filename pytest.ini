[pytest]
testpaths = tests
# --capture=sys, not the default fd capture: fd capture dup2()s new files onto
# fds 0/1/2 at every test phase, closing OS handles that Tcl caches for its
# standard channels when a Tk interpreter is created. Tk tests then fail to
# start ("couldn't read file init.tcl: No error") or Tcl panics. sys capture
# leaves the OS handles alone; tests that run subprocesses capture their
# output themselves.
addopts = --strict-markers --capture=sys
markers =
    windows_integration: drives real Win32 APIs or the registry sandbox; native Windows only
    real_system_proxy: touches the REAL system proxy; opt-in only, never run without the user's consent
    slow: takes several seconds
